spring.application.name=codebase-assistant
server.port=${PORT:8080}

# Neon PostgreSQL DataSource
spring.datasource.url=jdbc:postgresql://ep-misty-hat-b3kcvwdq-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=neondb_owner
spring.datasource.password=${NEON_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Spring AI - Google GenAI (AI Studio / API key mode)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}

# Models
spring.ai.google.genai.chat.options.model=gemini-3.6-flash
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001

# Spring AI - PgVector
spring.ai.vectorstore.pgvector.index-type=NONE
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=3072
spring.ai.vectorstore.pgvector.initialize-schema=true

# Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging - so real errors are visible in the console
logging.level.org.springframework.ai=DEBUG
logging.level.com.google.genai=DEBUG